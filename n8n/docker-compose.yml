# Local n8n automation engine.
# Imports n8n/Vindera_Daily_Scan.json, which triggers POST /api/v1/deals/scan.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: vindera_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Vienna
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: