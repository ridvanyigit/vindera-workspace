# Local LiteLLM gateway (learn/llmops Module 4).
# Proxy mode: an OpenAI-compatible server on :4000, so the backend only needs
# OPENAI_BASE_URL=http://localhost:4000/v1 in the root .env - no code changes
# in the agents beyond passing that base_url through.
#
# The `db` service and the UI_* variables are only for the optional Admin UI
# (Virtual Keys, Playground, Request Logs at http://localhost:4000/ui) - it is
# its own local Postgres, unrelated to Vindera's own Supabase database.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: vindera_litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../.env  # reads OPENAI_API_KEY; docker compose strips surrounding quotes, `docker run --env-file` does not
    environment:
      - DATABASE_URL=postgresql://litellm:litellm@db:5432/litellm
      - LITELLM_MASTER_KEY=sk-vindera-local-master-key
      - UI_USERNAME=admin
      - UI_PASSWORD=vindera-local
    volumes:
      - ./config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: vindera_litellm_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - litellm_db:/var/lib/postgresql/data

volumes:
  litellm_db:
