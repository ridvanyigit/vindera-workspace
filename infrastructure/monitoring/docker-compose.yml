# LOCAL monitoring stack: Prometheus scrapes the FastAPI backend, Grafana visualizes it.
# (The production stack is infrastructure/prod/docker-compose.yml.)
#
# Both UIs are bound to 127.0.0.1, so only this computer can open them.
# Grafana is on 3002 because the Next.js dev server owns 3000.
# GRAFANA_ADMIN_PASSWORD is REQUIRED: put it in a `.env` file next to this file
# (see .env.example; the file is git-ignored) or export it. There is no default.
# Grafana stores the admin password in its volume on the first start: changing the
# variable later does not change an existing login (Grafana -> Profile, or
# `docker exec vindera_grafana grafana cli admin reset-admin-password <new>`).

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: vindera_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: vindera_grafana
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infrastructure/monitoring/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Read by grafana-provisioning/datasources/datasources.yml and
      # grafana-provisioning/alerting/*.yml ($VAR expansion) so dashboards,
      # data sources and alerts survive a deleted container or a wiped
      # grafana_data volume: they are recreated from the files in
      # grafana-provisioning/ on every start, not stored only in the volume.
      - VINDERA_DB_HOST=${VINDERA_DB_HOST:-host.docker.internal}
      - VINDERA_DB_PORT=${VINDERA_DB_PORT:-54322}
      - VINDERA_DB_USER=${VINDERA_DB_USER:-postgres}
      - VINDERA_DB_PASSWORD=${VINDERA_DB_PASSWORD:-postgres}
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN:?Set PUSHOVER_API_TOKEN in infrastructure/monitoring/.env (same value as the root .env)}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:?Set PUSHOVER_USER_KEY in infrastructure/monitoring/.env (same value as the root .env)}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
